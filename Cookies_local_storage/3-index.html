<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cookie App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }

    #login-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    input {
      padding: 8px;
      width: 200px;
      font-size: 16px;
    }

    button {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    h1 {
      font-size: 32px;
      font-weight: bold;
      margin-top: 50px;
    }

    a {
      font-style: italic;
      margin-left: 10px;
      text-decoration: none;
      color: black;
    }
  </style>

</head>
<script src="index.js"></script>
<body onload="showWelcomeMessageFromCookies()">
  <div id="login-form">
    <h2>Login to the website</h2>
    <input type="text" id="firstname" placeholder="Firstname">
    <input type="email" id="email" placeholder="Email">
    <button onclick="setCookies()">Log me in</button>
  </div>

  <script>
    function setCookies() {
      const firstname = document.getElementById('firstname').value;
      const email = document.getElementById('email').value;

      const expirationDate = new Date();
      expirationDate.setDate(expirationDate.getDate() + 10);

      document.cookie = `firstname=${firstname}; expires=${expirationDate.toUTCString()}; path=/`;
      document.cookie = `email=${email}; expires=${expirationDate.toUTCString()}; path=/`;

      hideForm();
      showWelcomeMessageFromCookies();
    }

    function getCookie(name) {
      const cookies = document.cookie.split(';');
      for (let cookie of cookies) {
        const [key, value] = cookie.trim().split('=');
        if (key === name) return value;
      }
      return '';
    }

    function showForm() {
      const form = document.getElementById('login-form');
      form.style.display = 'flex';

      const welcome = document.getElementById('welcome');
      if (welcome) welcome.remove();
    }

    function hideForm() {
      const form = document.getElementById('login-form');
      form.style.display = 'none';
    }

    function deleteCookiesAndShowForm() {
      document.cookie = "firstname=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      document.cookie = "email=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      showForm();
    }

    function showWelcomeMessageFromCookies() {
      const firstname = getCookie('firstname');
      const email = getCookie('email');

      if (!firstname || !email) {
        showForm();
        return;
      }

      hideForm();

      const h1 = document.createElement('h1');
      h1.id = 'welcome';
      h1.innerHTML = `Welcome: ${firstname} <a href="#" onclick="deleteCookiesAndShowForm()">(logout)</a>`;
      document.body.appendChild(h1);
    }
  </script>
</body>
</html>
